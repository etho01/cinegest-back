apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cinegest-back-vault
  namespace: cinegest
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: cinegest-back-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cinegest/app
