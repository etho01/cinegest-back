name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: etho01/cinegest-back
  NAMESPACE: cinegest
  DEPLOYMENT_NAME: cinegest-back
  CONTAINER_NAME: app

jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_sqlite
          coverage: none
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      
      - name: Run tests
        run: php artisan test

  build-and-push:
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare metadata
        id: meta
        run: |
          IMAGE_TAG="manual-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "📦 Building image: $IMAGE_TAG"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/etho01/cinegest-back:${{ steps.meta.outputs.image_tag }}
            ghcr.io/etho01/cinegest-back:latest
          cache-from: type=registry,ref=ghcr.io/etho01/cinegest-back:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Pre-deployment checks
        run: |
          echo "🔍 Pre-deployment checks..."
          
          echo "Checking Vault status..."
          if kubectl -n vault get deployment vault &>/dev/null; then
            kubectl -n vault exec deploy/vault -- vault status || echo "⚠️ Vault may be sealed"
          else
            echo "⚠️ Vault not deployed"
          fi
          
          echo ""
          echo "Checking External Secrets..."
          if kubectl -n external-secrets get deployment &>/dev/null; then
            kubectl -n external-secrets get pods
          else
            echo "⚠️ External Secrets not installed"
          fi

      - name: Check and install External Secrets Operator
        run: |
          if ! kubectl get namespace external-secrets &>/dev/null; then
            echo "Installing External Secrets Operator..."
            helm repo add external-secrets https://charts.external-secrets.io
            helm repo update
            helm upgrade --install external-secrets \
              external-secrets/external-secrets \
              --namespace external-secrets \
              --create-namespace \
              --set installCRDs=true \
              --wait \
              --timeout 3m
            echo "✅ External Secrets Operator installed"
          else
            echo "✅ External Secrets Operator already installed"
          fi

      - name: Deploy Vault integration
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/vault/serviceaccount.yaml
          kubectl apply -f k8s/secretstore.yaml
          kubectl apply -f k8s/externalsecret.yaml
          echo "✅ Vault integration manifests deployed"

      - name: Wait for secrets synchronization
        run: |
          echo "⏳ Waiting for secrets to sync from Vault..."
          
          for i in {1..60}; do
            STATUS=$(kubectl -n ${NAMESPACE} get externalsecret cinegest-back-vault -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
            
            if [ "$STATUS" = "True" ]; then
              echo "✅ Secrets synchronized from Vault"
              kubectl -n ${NAMESPACE} get secret cinegest-back-secret
              break
            fi
            
            if [ $i -eq 60 ]; then
              echo "⚠️ Timeout waiting for Vault secrets synchronization"
              kubectl -n ${NAMESPACE} describe externalsecret cinegest-back-vault || true
              
              if kubectl -n ${NAMESPACE} get secret cinegest-back-secret &>/dev/null; then
                echo "⚠️ Using existing manual secret"
              else
                echo "❌ No secret available"
                exit 1
              fi
            fi
            
            sleep 2
          done

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/clusterissuer.yaml
          kubectl apply -f k8s/middleware.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Save current deployment image
        id: previous
        run: |
          PREVIOUS_IMAGE=$(kubectl -n ${NAMESPACE} get deployment ${DEPLOYMENT_NAME} -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
          echo "image=$PREVIOUS_IMAGE" >> $GITHUB_OUTPUT
          if [ -n "$PREVIOUS_IMAGE" ]; then
            echo "📸 Previous image: $PREVIOUS_IMAGE"
          fi

      - name: Update image
        run: |
          echo "🚀 Deploying image: ghcr.io/etho01/cinegest-back:${{ needs.build-and-push.outputs.image_tag }}"
          kubectl -n ${NAMESPACE} set image deployment/${DEPLOYMENT_NAME} \
            ${CONTAINER_NAME}=ghcr.io/etho01/cinegest-back:${{ needs.build-and-push.outputs.image_tag }}

      - name: Run migrations
        id: migrate
        run: |
          echo "🔄 Running database migrations..."
          kubectl -n ${NAMESPACE} delete job cinegest-back-migrate --ignore-not-found=true
          
          sed "s|ghcr.io/etho01/cinegest-back:latest|ghcr.io/etho01/cinegest-back:${{ needs.build-and-push.outputs.image_tag }}|g" \
            k8s/migrate-job.yaml | kubectl apply -f -
          
          if ! kubectl -n ${NAMESPACE} wait --for=condition=complete job/cinegest-back-migrate --timeout=300s; then
            echo "❌ Migration failed!"
            kubectl -n ${NAMESPACE} logs job/cinegest-back-migrate --tail=100
            exit 1
          fi
          
          echo "✅ Migrations completed successfully"

      - name: Wait rollout
        id: rollout
        run: |
          echo "⏳ Waiting for deployment rollout..."
          if ! kubectl -n ${NAMESPACE} rollout status deployment/${DEPLOYMENT_NAME} --timeout=300s; then
            echo "❌ Deployment failed!"
            kubectl -n ${NAMESPACE} describe deployment ${DEPLOYMENT_NAME}
            kubectl -n ${NAMESPACE} get pods -l app=cinegest-back
            kubectl -n ${NAMESPACE} logs -l app=cinegest-back --tail=100
            exit 1
          fi
          
          echo "✅ Deployment successful"

      - name: Post-deployment verification
        run: |
          echo "🔍 Post-deployment verification..."
          
          echo "Pods:"
          kubectl -n ${NAMESPACE} get pods -l app=cinegest-back
          
          echo ""
          echo "Deployment:"
          kubectl -n ${NAMESPACE} get deployment ${DEPLOYMENT_NAME}
          
          echo ""
          echo "Ingress:"
          kubectl -n ${NAMESPACE} get ingress

      - name: Rollback on failure
        if: failure() && steps.previous.outputs.image != ''
        run: |
          echo "🔄 Rolling back to previous image: ${{ steps.previous.outputs.image }}"
          kubectl -n ${NAMESPACE} set image deployment/${DEPLOYMENT_NAME} \
            ${CONTAINER_NAME}=${{ steps.previous.outputs.image }}
          kubectl -n ${NAMESPACE} rollout status deployment/${DEPLOYMENT_NAME} --timeout=300s
          echo "✅ Rollback completed"

      - name: Deployment Summary
        if: always()
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Image: ghcr.io/etho01/cinegest-back:${{ needs.build-and-push.outputs.image_tag }}"
          echo "Namespace: ${NAMESPACE}"
          echo "Status: ${{ job.status }}"
          echo ""
          echo "Current pods:"
          kubectl -n ${NAMESPACE} get pods -l app=cinegest-back -o wide
