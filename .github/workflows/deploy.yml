name: Deploy cinegest-back to K3s

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: etho01/cinegest-back
  NAMESPACE: cinegest
  DEPLOYMENT_NAME: cinegest-back
  CONTAINER_NAME: app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare metadata
        id: meta
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/etho01/cinegest-back:${{ steps.meta.outputs.image_tag }}
            ghcr.io/etho01/cinegest-back:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/clusterissuer.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Update image
        run: |
          kubectl -n ${NAMESPACE} set image deployment/${DEPLOYMENT_NAME} \
            ${CONTAINER_NAME}=ghcr.io/etho01/cinegest-back:${{ needs.build-and-push.outputs.image_tag }}

      - name: Run migrations
        run: |
          kubectl -n ${NAMESPACE} delete job cinegest-back-migrate --ignore-not-found=true
          sed "s|ghcr.io/etho01/cinegest-back:latest|ghcr.io/etho01/cinegest-back:${{ needs.build-and-push.outputs.image_tag }}|g" \
            k8s/migrate-job.yaml | kubectl apply -f -
          kubectl -n ${NAMESPACE} wait --for=condition=complete job/cinegest-back-migrate --timeout=300s

      - name: Wait rollout
        run: |
          kubectl -n ${NAMESPACE} rollout status deployment/${DEPLOYMENT_NAME} --timeout=300s