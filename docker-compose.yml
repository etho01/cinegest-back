services:
  database:
    image: mariadb:11
    container_name: db_cinegest-back
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cinegest
      MYSQL_USER: cinegest
      MYSQL_PASSWORD: cinegest
      TZ: Europe/Paris
    networks:
      - cinegest-back
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin_cinegest-back
    restart: always
    depends_on:
      - database
    ports:
      - "8890:80"
    environment:
      PMA_HOST: database
      UPLOAD_LIMIT: 30M
    networks:
      - cinegest-back

  api:
    build: ./
    container_name: cinegest-back
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8891:443"
      - "8892:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: cinegest
      DB_USERNAME: cinegest
      DB_PASSWORD: cinegest
      PHP_MEMORY_LIMIT: 512M
    restart: always
    networks:
      - cinegest-back

networks:
  cinegest-back:

volumes:
  db-data: